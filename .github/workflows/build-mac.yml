# 在 macOS runner 上打包知径，并发布到 GitHub Releases（方便他人下载）
# 用法：GitHub → Actions →「Build macOS」→ Run workflow
name: Build macOS

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run workflow regression tests
        run: npm run test:workflow

      - name: Read version
        id: ver
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -e
          test "${GITHUB_REF_NAME}" = "v${{ steps.ver.outputs.version }}"

      - name: Build DMG / ZIP (unsigned, arm64)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          set -e
          npm run dist:mac
          ls -lh release/*.dmg release/*.zip

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zhijing-mac-${{ github.sha }}
          path: |
            release/*.dmg
            release/*.zip
          if-no-files-found: error
          retention-days: 14

      - name: Publish to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: 知径 ${{ steps.ver.outputs.version }}
          body_path: docs/releases/v1.2.0.md
          files: |
            release/*.dmg
            release/*.zip
          fail_on_unmatched_files: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
