# 在 macOS runner 上打包知径，并发布到 GitHub Releases（方便他人下载）
# 用法：GitHub → Actions →「Build macOS」→ Run workflow
name: Build macOS

on:
  workflow_dispatch:
    inputs:
      build_mode:
        description: "构建模式：内部未签名留存包，或正式签名发布包"
        required: true
        default: internal-unsigned
        type: choice
        options:
          - internal-unsigned
          - signed-release
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  internal-mac:
    if: github.event_name == 'workflow_dispatch' && inputs.build_mode == 'internal-unsigned'
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run workflow regression tests
        run: npm run test:workflow

      - name: Read version
        id: ver
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Build unsigned Universal DMG / ZIP for internal retention only
        run: npm run dist:mac:internal

      - name: Verify Universal architectures
        run: |
          set -euo pipefail
          APP_PATH="$(find release -type d -name '知径.app' -print -quit)"
          test -n "$APP_PATH"
          ARCHS="$(lipo -archs "$APP_PATH/Contents/MacOS/知径")"
          echo "$ARCHS" | grep -q arm64
          echo "$ARCHS" | grep -q x86_64

      - name: Audit packaged app for private data and credentials
        run: |
          set -euo pipefail
          APP_PATH="$(find release -type d -name '知径.app' -print -quit)"
          AUDIT_PATH="$RUNNER_TEMP/zhijing-app-asar"
          node node_modules/@electron/asar/bin/asar.js extract "$APP_PATH/Contents/Resources/app.asar" "$AUDIT_PATH"
          test -z "$(find "$AUDIT_PATH" -type f \( -name '.env*' -o -name '*.db' -o -name '*.db-shm' -o -name '*.db-wal' -o -name '*.pem' -o -name '*.key' -o -name 'credentials*' \) -print -quit)"
          test -z "$(find "$AUDIT_PATH" -type d \( -name '.forge-data' -o -name 'workspaces' -o -name '.git' -o -name '.cursor' \) -print -quit)"
          if grep -R -I -n -E '/Users/|sk-ant-|sk-proj-|sk-[A-Za-z0-9_-]{30,}|OPENAI_API_KEY[[:space:]]*=|ANTHROPIC_API_KEY[[:space:]]*=|DEEPSEEK_API_KEY[[:space:]]*=' "$AUDIT_PATH"; then
            echo "Packaged app privacy audit failed"
            exit 1
          fi

      - name: Mark artifacts as unsigned and internal only
        run: |
          set -euo pipefail
          VERSION="${{ steps.ver.outputs.version }}"
          mv "release/Zhijing-${VERSION}-mac-universal.dmg" "release/Zhijing-${VERSION}-mac-universal-UNSIGNED-INTERNAL.dmg"
          mv "release/Zhijing-${VERSION}-mac-universal.zip" "release/Zhijing-${VERSION}-mac-universal-UNSIGNED-INTERNAL.zip"

      - name: Upload internal unsigned artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zhijing-mac-unsigned-internal-${{ github.sha }}
          path: |
            release/*-UNSIGNED-INTERNAL.dmg
            release/*-UNSIGNED-INTERNAL.zip
          if-no-files-found: error
          retention-days: 30

  mac:
    if: >-
      (github.event_name == 'push' && vars.ENABLE_SIGNED_MAC_RELEASE == 'true') ||
      (github.event_name == 'workflow_dispatch' && inputs.build_mode == 'signed-release')
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run workflow regression tests
        run: npm run test:workflow

      - name: Read version
        id: ver
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -e
          test "${GITHUB_REF_NAME}" = "v${{ steps.ver.outputs.version }}"

      - name: Require Apple signing and notarization credentials
        env:
          CSC_LINK: ${{ secrets.MACOS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          test -n "$CSC_LINK"
          test -n "$CSC_KEY_PASSWORD"
          test -n "$APPLE_API_KEY_P8_BASE64"
          test -n "$APPLE_API_KEY_ID"
          test -n "$APPLE_API_ISSUER"

      - name: Prepare App Store Connect API key
        env:
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$APPLE_API_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey.p8"

      - name: Build signed and notarized Universal DMG / ZIP
        env:
          CSC_LINK: ${{ secrets.MACOS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ runner.temp }}/AuthKey.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          npm run dist:mac
          ls -lh release/*.dmg release/*.zip

      - name: Verify signature, notarization and architectures
        run: |
          set -euo pipefail
          APP_PATH="$(find release -type d -name '知径.app' -print -quit)"
          test -n "$APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          codesign -dv --verbose=4 "$APP_PATH"
          xcrun stapler validate "$APP_PATH"
          spctl --assess --type execute --verbose=4 "$APP_PATH"
          ARCHS="$(lipo -archs "$APP_PATH/Contents/MacOS/知径")"
          echo "$ARCHS" | grep -q arm64
          echo "$ARCHS" | grep -q x86_64
          for dmg in release/*.dmg; do
            xcrun stapler validate "$dmg"
            spctl --assess --type open --context context:primary-signature --verbose=4 "$dmg"
          done

      - name: Verify release notes exist
        run: test -f "docs/releases/v${{ steps.ver.outputs.version }}.md"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zhijing-mac-${{ github.sha }}
          path: |
            release/*.dmg
            release/*.zip
          if-no-files-found: error
          retention-days: 14

      - name: Publish to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: 知径 ${{ steps.ver.outputs.version }}
          body_path: docs/releases/v${{ steps.ver.outputs.version }}.md
          files: |
            release/*.dmg
            release/*.zip
          fail_on_unmatched_files: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
